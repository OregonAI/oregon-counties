# Corpus configuration — the single source of truth the toolkit reads.
corpus:
  id: "oregon-counties"
  name: "Oregon Counties — Code, Ordinances, Policy and Land Use"
  jurisdiction: "oregon"             # corpus-level. Each DOCUMENT carries
                                     # oregon/<slug>-county; the frontmatter pattern
                                     # ^[a-z0-9-]+(/[a-z0-9-]+)*$ already permits it, so
                                     # this corpus needs no schema change anywhere.
  archetype: "document"
  # There is no single official source for 36 counties — each publishes its own law, and
  # naming any one of them here would be wrong for the other 35. The Oregon Association of
  # Counties directory is the closest thing to an authoritative ROSTER, and it is a roster,
  # not a repository: it holds no county law. `_meta/counties.yml` carries the per-county
  # official URL, which is what an agent actually needs to verify a document at source.
  authoritative_source: "https://oregoncounties.org/counties/"
  schema_version: 1
  contract_version: 1

# Issuing-body-scoped: counties/<county-slug>/<subdir>/<doc>.md
#
# WHY SCOPED. It buys two things no flat layout gives: every path segment is validated
# against the 36-county registry below (a typo'd slug is a build error, not a new county),
# and `issuing_body_slug` is populated in the FTS index from the PATH, so
# search_corpus(issuing_body="lane-county") and issuing_body_profile work with no extra code.
#
# The four subdirs map 1:1 onto the four document families the 36-county survey measured, so
# discovery output drops straight in without a translation step.
#
# THREE SUBDIRS SHARE doc_type: ordinance, and that is legal — ContentRoot.doc_type_for()
# resolves per LOCATION, and expected_root_for() is only consulted for a document sitting
# outside every root. Verified against corpus_toolkit/config.py:18 before committing to it.
#
# `land-use` is `ordinance` rather than `policy` because in Oregon a comprehensive plan and a
# development code are ADOPTED BY ORDINANCE and are binding land-use law under ORS 197 — they
# are not statements of intent, and typing them as policy would understate them.
content_roots:
  - path: "counties"
    scoped: true
    subdirs:
      code: ordinance            # the codified county code
      orders: ordinance          # board orders, court orders, resolutions as adopted
      policies: policy           # HR, purchasing, public records, IT, travel
      land-use: ordinance        # comprehensive plan, zoning, development code

plugins:
  # Vector search over the prebuilt embeddings artifact. The implementation is shared --
  # corpus_toolkit.semantic.search -- rather than a per-repo copy, because eight copies of a
  # loader do not stay identical and the details that drift are the expensive ones (the
  # convert-once matmul, the dim probe that fails a mismatched model closed).
  #
  # `_meta/embeddings/` is gitignored and mounted at runtime: it is derived from the
  # documents beside it, it needs a GPU to build, and it is far too large to commit. If the
  # mount is missing the server does NOT fail -- available() returns False and search_corpus
  # serves keyword-only, silently. That is the documented sharp edge, so the compose
  # healthcheck asserts availability rather than trusting a green container.
  semantic_search_module: "corpus_toolkit.semantic.search"
  citation_module: "src.citation_schemes"
  issuing_body_registry: "_meta/counties.yml"
  # The registry's top-level key is `counties`, not the default `entries`. Getting this
  # wrong does not error — the toolkit reads an EMPTY registry and silently enforces no slug
  # validation at all, which is the whole reason the scoped root was chosen.
  issuing_body_registry_key: "counties"
  extra_schema_checks:
    - path: "_meta/sources/*.yml"
      schema: "_meta/schema/source-group.schema.json"

# ERF holds the ORS and OAR that county instruments implement. This is the edge that makes
# the corpus more than a document dump: a county ordinance should walk up to the state law it
# implements. Land use is the densest case — ORS 197 and the OAR 660 statewide planning goals
# bind county comprehensive plans directly.
#
# NOT declared: oregon-audits. Measured first, and it does not earn a sibling entry — 70 of
# 242 audit reports name an Oregon county and ZERO cite a county code, ordinance, charter or
# board order. Counties appear there as subjects and grant recipients, not as law the auditor
# construes. Declaring it would promise a resolution that has nothing to resolve.
siblings:
  - id: "executive-regulatory-frameworks"
    index_url: "https://oregonai.github.io/executive-regulatory-frameworks/corpus-index.json"
    web_base:  "https://github.com/OregonAI/executive-regulatory-frameworks/blob/main/"

disclaimer_marker: "NON-AUTHORITATIVE"
graph_path: "_meta/graph.json"
# Directory mode: one group file per county. 36 counties on 6+ platforms update at
# unrelated rates, and a single manifest would make every county's drift one county's
# problem. Note the loader reads *.yml ONLY — a .yaml file here is silently invisible.
source_manifest_path: "_meta/sources"
snapshot_dir: "_meta/snapshots"

mcp:
  server_name: "oregon-counties"
  # Surfaced on get_document so an agent can see the county's own governance form and
  # authority basis without a second lookup — the two facts that make "what does this
  # ordinance mean" answerable differently for a charter county and a general-law one.
  extra_document_fields: ["authority_level", "effective_date", "source_version"]
  # THE EDGE THIS CORPUS EXISTS FOR, made reachable through the tool agents actually call.
  #
  # authority_chain walks implements/implemented_by unconditionally. This corpus asserts
  # NEITHER: it records citations as references_external, because a county ordinance citing
  # ORS 215.203 is usually implementing it and *usually* is not a fact. So authority_chain
  # returned an empty answer over 9,704 real edges, 79% of which resolve into ERF.
  #
  # Declaring them here returns them under `up_cites`, beside `up_implements` and never
  # inside it. The naming is load-bearing: an agent reading `up_cites` learns this document
  # CITES that law, which is what was measured. Reading it as an implementation claim would
  # be a misreading of the data — see corpus-toolkit docs/mcp-interface-contract.md.
  authority_relations:
    up:
      cites: [references_external]

status:
  reverify_days: 180                 # county code moves far more slowly than state rule

provenance:
  coverage_fail_threshold: 0.70
  coverage_warn_threshold: 0.90
