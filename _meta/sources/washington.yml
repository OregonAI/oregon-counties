group: washington
title: Washington County sources
county: washington-county
crawl:
  decision: proceed
  checked: '2026-07-31'
  basis: 'library.municode.com names ClaudeBot and disallows it, and sets Content-Signal: ai-train=no.
    The operator''s decision (PLAN.md Phase 12) is that the text of county law is authored by the county
    and the vendor is a host, so this directive is not treated as binding for that text. The line held:
    we do not evade technical access controls. api.municode.com serves HTTP 200 to the honest, self-identifying
    User-Agent in src/fetch.py, so nothing here impersonates a browser. Fetched once, cached, rate-limited.'
  hosts:
  - host: library.municode.com
    robots_url: https://library.municode.com/robots.txt
    ai_block: true
    content_signal: search=yes, ai-train=no, use=reference
    notes: 'Cloudflare-managed AI block naming ClaudeBot, CCBot, GPTBot, Amazonbot, Applebot-Extended,
      Bytespider and Google-Extended, each with Disallow: /. Framed as an EU DSM Art. 4 rights reservation.
      This host is the human-facing JS shell and is NOT fetched by this profile; the API below is.'
  - host: api.municode.com
    robots_url: null
    ai_block: false
    content_signal: null
    notes: Open JSON API, no robots.txt served. Returns 200 to the honest agent.
  - host: www.washingtoncountyor.gov
    robots_url: https://www.washingtoncountyor.gov/robots.txt
    ai_block: false
    content_signal: null
    notes: Stock Drupal, byte-identical to Multnomah's. No AI agent named.
last_checked: '2026-07-31'
upstream_signal: Jobs/latest/<productId> names the current supplement and its publish date, so the supplement
  number is a real change signal — the only vendor in this build that exposes one.
