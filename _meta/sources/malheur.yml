group: malheur
title: Malheur County sources
county: malheur-county
crawl:
  decision: proceed
  checked: '2026-08-01'
  basis: 'The county''s own site states no AI-agent directive and serves the honest agent HTTP 200; those
    families are taken. The CODE is a different matter: American Legal names ClaudeBot and GPTBot with
    Disallow: / and Content-Signal: ai-train=no, AND returns 403 to the honest agent — so the block is
    at the HTTP layer, not just in a directives file, and getting past it would mean misrepresenting what
    we are. Code family recorded unavailable.'
  hosts:
  - host: www.malheurco.org
    robots_url: https://www.malheurco.org/robots.txt
    ai_block: false
    content_signal: null
    notes: County's own WordPress site. 200 to the honest agent.
  - host: codelibrary.amlegal.com
    robots_url: https://codelibrary.amlegal.com/robots.txt
    ai_block: true
    content_signal: ai-train=no
    notes: 'American Legal. Names ClaudeBot and GPTBot Disallow: /. Returns 403 to the honest agent —
      NOT fetched, and not retried in disguise.'
last_checked: '2026-07-31'
upstream_signal: No feed. WordPress upload paths are dated by year/month, so a new document appears as
  a new upload path in the relevant department page.
