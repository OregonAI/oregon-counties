group: marion
title: Marion County sources
county: marion-county
crawl:
  decision: proceed
  checked: '2026-07-31'
  basis: codepublishing.com challenged HTTP/1.1 requests and passes HTTP/2 ones — a protocol-version rule,
    not identity. Since src/fetch.py speaks HTTP/2 the site answers our unchanged, self-identifying User-Agent
    with 200. robots.txt names no AI agent, so the corpus-wide vendor-directive decision is not engaged
    here at all; there was never a stated preference to weigh.
  hosts:
  - host: www.codepublishing.com
    robots_url: https://www.codepublishing.com/robots.txt
    ai_block: false
    content_signal: null
    notes: robots.txt disallows /cgi-bin/ /CPC/ /dtSearch/ /errors/ /search/ /Search_forms/ and *.pl *.pm
      *.js *.pdf *.rtf *nt.html — no AI agent named, and none of it covers the HTML code tree we read.
      Its Cloudflare config challenges HTTP/1.1 and passes HTTP/2.
last_checked: '2026-07-31'
upstream_signal: No feed. Code Publishing republishes the whole static site on codification, so re-hashing
  each chapter page detects an amendment. Chapter paths are stable across republications.
