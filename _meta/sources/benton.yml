group: benton
title: Benton County sources
county: benton-county
crawl:
  decision: proceed
  checked: '2026-07-31'
  basis: 'Same determination as Washington County, and for the same reason: library.municode.com names
    ClaudeBot and sets Content-Signal: ai-train=no, and under the Phase 12 decision that directive is
    not treated as binding for the text of county law, which Benton authors and Municode hosts. No evasion
    is involved — api.municode.com serves HTTP 200 to the honest, self-identifying agent, and the JS-shell
    host that carries the directive is not fetched.'
  hosts:
  - host: library.municode.com
    robots_url: https://library.municode.com/robots.txt
    ai_block: true
    content_signal: search=yes, ai-train=no, use=reference
    notes: Human-facing JS shell carrying the AI block. NOT fetched by this profile.
  - host: api.municode.com
    robots_url: null
    ai_block: false
    content_signal: null
    notes: Open JSON API, no robots.txt served. 200 to the honest agent.
last_checked: '2026-07-31'
upstream_signal: Jobs/latest/<productId> names the current supplement and its publish date, so the supplement
  number is a real change signal rather than a re-hash.
