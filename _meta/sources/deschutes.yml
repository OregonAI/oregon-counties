group: deschutes
title: Deschutes County sources
county: deschutes-county
crawl:
  decision: proceed
  checked: '2026-07-31'
  basis: No AI-agent directive on any host used here. The S3 bucket serves no robots.txt at all and the
    MCO subdomain returns 404 for robots.txt and sitemap.xml, so there is nothing to honour or decline.
    The county's own Laserfiche system DOES disallow the paths its documents live behind, and that family
    is skipped for exactly that reason — see families.policies.
  hosts:
  - host: s3-us-west-2.amazonaws.com
    robots_url: null
    ai_block: false
    content_signal: null
    notes: ListObjectsV2 answers unauthenticated; no robots.txt served
  - host: deschutescounty.municipalcodeonline.com
    robots_url: https://deschutescounty.municipalcodeonline.com/robots.txt
    ai_block: false
    content_signal: null
    notes: robots.txt and sitemap.xml both 404 — no directives exist
  - host: weblink.deschutes.org
    robots_url: https://weblink.deschutes.org/robots.txt
    ai_block: false
    content_signal: null
    notes: Disallows /DocView.aspx and /Search.aspx — the county's own document system refusing the exact
      retrieval path. Path-specific, not an AI-agent block, and it is the county speaking about its own
      site rather than a vendor speaking about the county's law. Honoured.
last_checked: '2026-07-31'
upstream_signal: No feed. New ordinances appear as new S3 keys with a fresh upload epoch, so a re-list
  and diff of the key set is the freshness check — cheap, and exact.
