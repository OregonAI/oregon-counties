group: multnomah
title: Multnomah County sources
county: multnomah-county
crawl:
  decision: proceed
  checked: '2026-07-31'
  basis: Stock Drupal robots.txt naming no AI agent and disallowing only framework paths (/core/, /profiles/,
    /README.md). Nothing blocks /file/, /board/ or /info/, which is where every document here lives. No
    determination to make.
  hosts:
  - host: multco.us
    robots_url: https://multco.us/robots.txt
    ai_block: false
    content_signal: null
    notes: 'Disallow: /core/ /profiles/ /README.md only. Sitemap index at /sitemap.xml, 5 sub-sitemaps.'
  - host: www.multco.us
    robots_url: https://www.multco.us/robots.txt
    ai_block: false
    content_signal: null
    notes: Same site; www redirects to the bare host, which is canonical.
last_checked: '2026-07-31'
upstream_signal: No feed. The code index page is edited when a chapter is amended, and the chapter slugs
  are stable, so re-fetching the index and diffing the link set detects a new or renamed chapter; content
  drift is caught by re-hashing each PDF.
