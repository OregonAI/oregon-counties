crawl:
  decision: proceed
  checked: '2026-08-01'
  basis: The county's own site states no AI directive and serves us fine. Its ORDERS are in Google Drive,
    whose download host disallows everyone — honoured, and it is a blanket directive rather than one aimed
    at us.
  hosts:
  - host: www.co.wallowa.or.us
    robots_url: https://www.co.wallowa.or.us/robots.txt
    ai_block: false
    content_signal: null
    notes: No named AI agents.
  - host: drive.usercontent.google.com
    robots_url: null
    ai_block: false
    content_signal: null
    notes: 'Blanket Disallow: / on the Drive download host. Honoured; the folder view is also a client-side
      app with no per-file URLs.'
last_checked: '2026-07-31'
upstream_signal: No feed and no codification, so there is no consolidated text whose hash would change;
  freshness means new documents appearing in the land-use section.
