group: yamhill
title: Yamhill County sources
county: yamhill-county
crawl:
  decision: proceed
  checked: '2026-07-31'
  basis: yamhillcounty.gov names ClaudeBot and disallows it — and unlike Municode or General Code, the
    publisher here IS the county, so the 'vendor is only a host' reasoning does not apply. Ingested anyway
    under the Phase 12 decision, which was about the text of county law rather than about who hosts it,
    and a county's own published law is the plainest public record there is. Flagged rather than glossed,
    because a reviewer may read this one differently. Served HTTP 200 to the honest agent; nothing disguised.
    The civicplus.com mirror, which disallows everyone, is deliberately NOT used.
  hosts:
  - host: www.yamhillcounty.gov
    robots_url: https://www.yamhillcounty.gov/robots.txt
    ai_block: true
    content_signal: null
    notes: 'Cloudflare-managed AI list: ClaudeBot, CCBot, GPTBot, Amazonbot, Applebot-Extended, Bytespider,
      Google-Extended, each Disallow: /. THE COUNTY''S OWN DIRECTIVE, not a vendor''s — see basis.'
  - host: or-yamhillcounty.civicplus.com
    robots_url: null
    ai_block: false
    content_signal: null
    notes: 'Mirror serving identical pages under a blanket Disallow: /. NOT used.'
last_checked: '2026-07-31'
upstream_signal: No feed. DocumentCenter ids are stable and a replaced document gets a new id, so diffing
  the id set on each index detects both additions and replacements.
