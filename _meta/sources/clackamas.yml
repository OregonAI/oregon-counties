group: clackamas
title: Clackamas County sources
county: clackamas-county
crawl:
  decision: proceed
  checked: '2026-07-31'
  basis: No AI-agent directive. Nothing on the county site names an AI crawler or restricts the /code
    or /planning trees, so there is no determination to make beyond fetching politely — one request at
    a time, cached once.
  hosts:
  - host: www.clackamas.us
    robots_url: https://www.clackamas.us/robots.txt
    ai_block: false
    content_signal: null
    notes: No named AI agents. /code and /planning are open.
last_checked: '2026-07-31'
upstream_signal: No feed. Sections are edited in place, so content drift is caught only by re-hashing
  each page; a new or repealed section shows up as a link appearing or disappearing from the index.
