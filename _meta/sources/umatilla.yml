group: umatilla
title: Umatilla County sources
county: umatilla-county
crawl:
  decision: proceed
  checked: '2026-07-31'
  basis: 'No robots.txt exists on any Umatilla domain — each returns the TYPO3 ''Page Not Found'' page
    rather than a directives file, so there is nothing stated to honour or decline. Absence of a robots.txt
    is not permission in itself, so fetching stays polite: one request at a time, cached once.'
  hosts:
  - host: umatillacounty.gov
    robots_url: https://umatillacounty.gov/robots.txt
    ai_block: false
    content_signal: null
    notes: No robots.txt (TYPO3 404 page). Canonical host; pinned for ingest because a completed path
      migration left cached URLs 404ing.
  - host: www.co.umatilla.or.us
    robots_url: null
    ai_block: false
    content_signal: null
    notes: Same property. Used for land-use, where the documents were verified.
last_checked: '2026-07-31'
upstream_signal: No feed. Filenames encode the chapter number, so a new chapter appears as a new link
  in the ordinances index; amendments replace the PDF in place and are caught by re-hashing.
