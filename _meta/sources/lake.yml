group: lake
title: Lake County sources
county: lake-county
crawl:
  decision: proceed
  checked: '2026-08-01'
  basis: 'THE ONLY HOST IN THIS CORPUS WHOSE robots.txt NAMES ClaudeBot AND DISALLOWS IT. Ingested on
    an explicit operator decision taken with that fact in front of them, under the Phase 12 reasoning
    that the county authors its law and the vendor hosts it. No evasion involved: the site serves our
    unchanged self-identifying User-Agent HTTP 200 over HTTP/2, and the earlier 403 was the same protocol-version
    artefact that kept Marion out. This is declining to honour a stated preference — recorded as such,
    not dressed up as anything else.'
  hosts:
  - host: lake.county.codes
    robots_url: https://lake.county.codes/robots.txt
    ai_block: true
    content_signal: null
    notes: 'Names claudebot, gptbot, ccbot, amazonbot, applebot-extended, bytespider, google-extended
      and meta-externalagent, each Disallow: /. The one genuine AI objection among the corpus''s blocked
      hosts.'
last_checked: '2026-07-31'
upstream_signal: No feed. Titles are server-rendered at stable /LCC/<n> paths, so re-hashing each detects
  an amendment and a new title appears as a new link on the index.
