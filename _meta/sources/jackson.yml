group: jackson
title: Jackson County sources
county: jackson-county
crawl:
  decision: proceed
  checked: '2026-07-31'
  basis: No AI-agent directive on the county host. Revize origins vary between counties on this point
    — cms9files (Josephine) blocks generic agents while cms2 (Jackson) does not — so the origin was checked
    separately rather than assumed from the county domain.
  hosts:
  - host: jacksoncountyor.gov
    robots_url: https://jacksoncountyor.gov/robots.txt
    ai_block: false
    content_signal: null
    notes: PDFs allowed. Returns a real 404 for a nonexistent path, unlike the Gilliam Revize instance
      which soft-404s with HTTP 200.
last_checked: '2026-07-31'
upstream_signal: The `?t=<timestamp>` query on every code link changes when a chapter is republished,
  so diffing the link set detects an amendment without fetching a byte — the only county in this build
  that exposes such a signal.
