# Canonical registry of Oregon's 36 counties. This is the ROSTER and the slug validator,
# not a build list — every county is present, `built:` says which have documents yet.
# `plugins.issuing_body_registry_key` in corpus.yml must stay `counties`.
#
# WHY THESE FIELDS. Three of them are read by src/check_guardrails.py, because they are the
# facts that make identical-looking county documents mean different things:
#
#   governing_body  6 of 36 counties are governed by a COUNTY COURT (a county judge sitting
#                   with two commissioners), not a Board of Commissioners. Their instruments
#                   are court orders and journal entries. Naming a Board in those counties is
#                   simply wrong, and CI rejects it.
#   home_rule       8 are home-rule charter counties, 28 operate under general law. An
#                   ordinance does not carry the same authority in both, which is why no
#                   document here may claim county_charter authority in a general-law county.
#   population      Build order. Census POPESTIMATE2024, carried here rather than recalled,
#                   because it is the denominator of every coverage claim this corpus makes.
#
#   deferred        Set where a county cannot be built for a reason that is OURS, not the
#                   county's. Four counties sit behind Cloudflare managed challenges that
#                   refuse an honestly-identified agent while serving a browser. Getting past
#                   one means misrepresenting what we are, which this project does not do —
#                   see AGENTS.md. They are scheduled LAST rather than dropped, because the
#                   blocker is a commercial intermediary and may lift: registering with
#                   Cloudflare's Verified Bots programme would unblock all four at once.
#                   `deferred` is never evidence about what a county publishes.
#
# Ordered by population descending, which is also the build order.
#
# Sources: US Census co-est2024-alldata.csv (population, FIPS); the 36-county source survey
# at corpus-seeds/oregon-counties.survey.yml (governing_body, home_rule, domains), which
# verified every URL by fetching it.
note: 'Oregon counties. governing_body and home_rule are load-bearing for CI guardrails, not
